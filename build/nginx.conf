# ============================
# Nginx Configuration: PID-LAND
# ============================

events {}

http {
    include /etc/nginx/mime.types;
    sendfile on;

    # -----------------------
    # Upstream Tornado app
    # -----------------------
    upstream pid-land {
        server pid-land:8888;  # nome container pid-lander
    }

    # -----------------------
    # Server block
    # -----------------------
    server {
        listen 80 default_server;
        listen [::]:80;
        server_name www.example.com;

        keepalive_timeout 70;

        # -----------------------
        # Security headers
        # -----------------------
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";

        # -----------------------
        # Resolver endpoint
        # -----------------------
        location ~ ^/resolver/(?<prefix>\d+)/(?<handle>.+)$ {
            # Pass path + query string to Tornado
            proxy_pass http://pid-land$request_uri;
            # proxy_pass http://pid-land$uri$is_args$args;
            # proxy_pass http://pid-land$uri$is_args

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;

            # Optional: timeout tweaks
            proxy_connect_timeout 30s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # -----------------------
        #  /11099 URL redirect
        # -----------------------
        location ~ ^/XXXXXX/(?<handle>.+)$ {
            rewrite ^/XXXXX/(.*)$ /resolver/XXXXX/$1?$args last;

        }

        # -----------------------
        # Catch-all fallback
        # -----------------------
        location / {
            return 404;
        }
    }

    # -----------------------
    # Optional SSL placeholder
    # -----------------------
    # Uncomment when certificates are ready
    # server {
    #     listen 443 ssl;
    #     server_name repo.int.ingv.it;
    #
    #     ssl_certificate /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #
    #     include snippets/ssl-params.conf;
    #
    #     location ~ ^/resolver/(?<prefix>\d+)/(?<handle>.+)$ {
    #         proxy_pass http://pid-land$request_uri;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Host $server_name;
    #     }
    # }
}
