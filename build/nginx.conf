# ============================
# Nginx Configuration: PID-LAND
# Docker setup:
# - nginx container
# - pid-land (tornado) container listening on 8888
# ============================

events {}

http {
    include /etc/nginx/mime.types;
    sendfile on;

    # -----------------------
    # Upstream Tornado app
    # -----------------------
    upstream pid-land {
        server pid-land:8888;   # Docker service/container name
    }

    # -----------------------
    # Server block
    # -----------------------
    server {
        listen 80 default_server;
        listen [::]:80;
        server_name repo.int.ingv.it;

        keepalive_timeout 70;

        # -----------------------
        # Security headers
        # -----------------------
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";

        # -----------------------
        # Canonical resolver endpoint
        # -----------------------
        location ~ ^/resolver/(?<prefix>\d+)/(?<handle>.+)$ {

            # Strip /resolver before forwarding to Tornado
            rewrite ^/resolver/(.*)$ /$1 break;

            proxy_pass http://pid-land;   # Forwards rewritten URI + query string

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;

            proxy_connect_timeout 30s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # -----------------------
        # Legacy Handle format: /11099/<handle>
        # Preserves query string automatically
        # -----------------------
        location ~ ^/11099/(?<handle>.+)$ {
            rewrite ^/11099/(.*)$ /resolver/11099/$1 last;
        }

        # -----------------------
        # OAI-PMH endpoint
        # -----------------------
        location /oai {

            proxy_pass http://pid-land;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;

            proxy_connect_timeout 30s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
}
        # -----------------------
        # Catch-all fallback
        # -----------------------
        location / {
            return 404;
        }
    }
}
