version: "3"
services:

  ########## PID LANDING SERVICE ##########
  pid-lander:
    image: base-landing:1.3
    container_name: pid-land
    hostname: landing-server
    user: sysop
    tty: true
    restart: unless-stopped
    command: python3 pid_land.py
    volumes:
      - /pid_land/:/usr/src/code
      - /archive/trust:/var/lib/archive/trust
      - /archive/version:/var/lib/archive/version
      - /log:/usr/src/code/log   # Tornado logs
    ports:
      - 8888:8888
    networks:
      - pid_land

  ########## WEB_PROXY ##########
  web_proxy:
    image: nginx:alpine
    container_name: pid-land_web_proxy
    hostname: pid-land_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /pid_land/build/nginx.conf:/etc/nginx/nginx.conf:ro
      #- /pid_land/certs:/etc/nginx/certs:ro    # placeholder SSL
    networks:
      - pid_land

networks:
  pid_land:
    driver: bridge
